<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Lumina Interior Finishes</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='8' cy='8' r='8' fill='%23B95F45'/><circle cx='16' cy='16' r='8' fill='%23D4A353'/><circle cx='8' cy='16' r='8' fill='%239CA798'/></svg>">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-container { min-height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }
        .top-right-actions { position: absolute; top: 30px; right: 30px; z-index: 10; display: flex; gap: 15px; }
        [dir="rtl"] .top-right-actions { right: auto; left: 30px; }
        .auth-card { background: white; padding: 50px; width: 100%; max-width: 450px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
        .auth-input-wrapper { position: relative; margin-bottom: 20px; }
        .auth-input { width: 100%; padding: 15px 20px; border: 1px solid var(--border-color); background: var(--primary-bg); font-family: var(--font-primary); font-size: 15px; outline: none; }
        .auth-input.has-icon { padding-right: 50px; }
        [dir="rtl"] .auth-input.has-icon { padding-right: 20px; padding-left: 50px; }
        .pwd-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; }
        [dir="rtl"] .pwd-toggle { right: auto; left: 15px; }
        .social-btn { width: 100%; padding: 12px; border: 1px solid var(--border-color); background: transparent; color: var(--color-charcoal); font-family: var(--font-primary); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .social-btn:hover { background: var(--color-warm-cream); border-color: var(--color-terracotta); color: var(--color-terracotta); }
        .divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }
        .hover-underline { text-decoration: none; color: var(--color-terracotta); font-weight: 600; }
        .hover-underline:hover { text-decoration: underline; }
    </style>
</head>
<body class="bg-cream">
    <div class="auth-container">
        <div class="top-right-actions mobile-auth-toggles">
            <button class="theme-toggle" aria-label="Toggle Dark Mode" style="background:transparent; border:1px solid currentColor; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--color-charcoal); font-size:14px; cursor:pointer;">☾</button>
            <button class="rtl-toggle" aria-label="Toggle RTL" style="background:transparent; border:1px solid currentColor; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--color-charcoal); font-size:14px; cursor:pointer;">⇄</button>
        </div>

        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 40px;">
                <a href="index.html" style="display: inline-flex; align-items: center; gap: 10px; color: var(--color-terracotta); text-decoration: none;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                        <circle cx="8" cy="8" r="8" fill="var(--color-terracotta)"/>
                        <circle cx="16" cy="16" r="8" fill="var(--color-mustard)"/>
                        <circle cx="8" cy="16" r="8" fill="var(--color-sage)"/>
                    </svg>
                    <span style="font-size: 24px; font-weight: 600; font-family: var(--font-primary);">Lumina</span>
                </a>
            </div>
            
            <h4 style="text-align: center; margin-bottom: 30px; color: var(--color-charcoal);">Welcome Back</h4>
            
            <form action="dashboard.html">
                <div class="auth-input-wrapper">
                    <label style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--color-sage); text-transform: uppercase;">Email</label>
                    <input type="email" class="auth-input" required>
                </div>
                <div>
                    <label style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--color-sage); text-transform: uppercase;">Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" class="auth-input has-icon" id="loginPassword" required>
                        <button type="button" class="pwd-toggle" onclick="togglePassword('loginPassword', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path class="eye-path" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle class="eye-circle" cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 13px;">
                    <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="hover-underline">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn">Log In</button>
                
                <div class="divider">or continue with</div>
                
                <button type="button" class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button type="button" class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.95.97 3.67 2.31-3.23 1.83-2.68 6.2.51 7.42-.71 1.34-1.53 2.58-2.83 3.28zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                    Apple
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 30px; font-size: 14px; color: var(--text-secondary);">
                Don't have an account? <a href="register.html" class="hover-underline">Register</a>
            </p>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script>
        function togglePassword(inputId, btnElement) {
            const input = document.getElementById(inputId);
            const path = btnElement.querySelector('.eye-path');
            const circle = btnElement.querySelector('.eye-circle');
            
            if (input.type === 'password') {
                input.type = 'text';
                path.setAttribute('d', 'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24');
                circle.setAttribute('display', 'none');
                
                // Add the slash line
                const slash = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                slash.setAttribute('x1', '1');
                slash.setAttribute('y1', '1');
                slash.setAttribute('x2', '23');
                slash.setAttribute('y2', '23');
                slash.classList.add('eye-slash-line');
                btnElement.querySelector('svg').appendChild(slash);
            } else {
                input.type = 'password';
                path.setAttribute('d', 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z');
                circle.setAttribute('display', 'block');
                
                // Remove the slash line
                const slash = btnElement.querySelector('.eye-slash-line');
                if (slash) slash.remove();
            }
        }
    </script>
<button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
</body>
</html>
